name: checks

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Record maths
        run: node scripts/stats-check.mjs
      - run: npm run build
      - name: Demo end to end (no wallet, no money)
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3310 > /dev/null && break; sleep 1; done
          node scripts/e2e-demo.mjs
      - name: Live wiring (skips itself; Live mode is off in CI)
        run: node scripts/live-check.mjs

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/keys
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - run: cargo test
